[project]
name = "build-llm-from-scratch"
version = "0.1.0"
description = "An LLM implemented from scratch, following Sebastian Raschka's course: https://www.youtube.com/playlist?list=PLTKMiZHVd_2IIEsoJrWACkIxLRdfMlw11"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyterlab>=4.0",
    "matplotlib>=3.7.1",
    "numpy>=1.26",
    "pandas>=2.2.1",
    "psutil>=5.9.5",
    "tensorflow>=2.20.0",
    "tiktoken>=0.5.1",
    "torch>=2.2.2",
    "tqdm>=4.66.1",
]
